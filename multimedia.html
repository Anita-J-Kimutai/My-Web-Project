<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multimedea</title>
    <style>
        body {
            margin: 0;
            background-color: darkgreen;
            font-family: Arial, sans-serif;
        }

        /* Header at the top */
        header {
            background-color: lightgreen;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
        }

        /* Center video */
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 100px);
        }

        video {
            border: 4px solid white;
            border-radius: 10px;
        }
    </style>



</head>

<body>

<header>My video</header>

<div class="video-container">
<video width="600" height="400" controls preload="metadata">
  <source src="movie.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>
</div>

</body>
</html>
